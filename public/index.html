<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Text Sync (WebRTC Only)</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #202330;
      --muted: #5f6578;
      --brand: #1363df;
      --brand-2: #0f4eb0;
      --border: #d8e0ee;
      --ok: #1f8f52;
      --warn: #a86a00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top right, #e8f1ff, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(21, 44, 88, 0.1);
      padding: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }

    .muted {
      color: var(--muted);
      margin-top: 0;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    input,
    button,
    textarea {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    button {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      cursor: pointer;
    }

    button:hover {
      background: var(--brand-2);
    }

    .status-line {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status-line strong {
      color: var(--ok);
    }

    .status-line .warn {
      color: var(--warn);
    }

    .texts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      font-family: Consolas, 'Courier New', monospace;
      line-height: 1.4;
    }

    textarea[readonly] {
      background: #f8fafc;
    }

    pre {
      margin: 12px 0 0;
      max-height: 180px;
      overflow: auto;
      background: #0f1424;
      color: #9bd0ff;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
    }

    @media (max-width: 780px) {
      .texts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Realtime Text Sync (WebRTC Only)</h1>
    <p class="muted">Open on two devices, join the same room, and start typing. Text syncs instantly.</p>

    <div class="row">
      <input id="roomId" value="demo-room" placeholder="Room ID" />
      <button id="joinBtn">Join Room</button>
    </div>

    <p class="status-line">
      Signaling: <strong id="signalStatus">connecting</strong>
      | Peer: <strong id="peerStatus" class="warn">disconnected</strong>
      | Transport: <strong id="transportStatus" class="warn">not-ready</strong>
    </p>

    <div class="texts">
      <div>
        <p class="muted">Your text</p>
        <textarea id="myText" placeholder="Type here..." disabled></textarea>
      </div>
      <div>
        <p class="muted">Remote mirror</p>
        <textarea id="remoteText" readonly placeholder="Remote typing appears here"></textarea>
      </div>
    </div>

    <pre id="log"></pre>
  </main>

  <script>
    const logEl = document.getElementById('log');
    const roomIdEl = document.getElementById('roomId');
    const myTextEl = document.getElementById('myText');
    const remoteTextEl = document.getElementById('remoteText');
    const joinBtn = document.getElementById('joinBtn');
    const signalStatusEl = document.getElementById('signalStatus');
    const peerStatusEl = document.getElementById('peerStatus');
    const transportStatusEl = document.getElementById('transportStatus');

    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${location.host}`);

    const fallbackRtcConfig = {
      iceTransportPolicy: 'all',
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ],
    };

    let pc;
    let dc;
    let joined = false;
    let isMakingOffer = false;
    let ignoreOffer = false;
    let isPolite = true;
    let iceCandidateBuffer = [];
    let rtcConfigPromise;
    let sendTimer;
    let roomId = '';

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function sendWs(payload) {
      ws.send(JSON.stringify(payload));
    }

    function setSignalStatus(value, warn = false) {
      signalStatusEl.textContent = value;
      signalStatusEl.className = warn ? 'warn' : '';
    }

    function setPeerStatus(value, warn = false) {
      peerStatusEl.textContent = value;
      peerStatusEl.className = warn ? 'warn' : '';
    }

    function setTransportStatus(value, warn = false) {
      transportStatusEl.textContent = value;
      transportStatusEl.className = warn ? 'warn' : '';
    }

    async function getRtcConfig() {
      if (rtcConfigPromise) return rtcConfigPromise;
      rtcConfigPromise = (async () => {
        try {
          const response = await fetch('/ice-config', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const config = await response.json();
          if (!config || !Array.isArray(config.iceServers) || config.iceServers.length === 0) {
            throw new Error('invalid payload');
          }
          log(`Loaded ICE config (${config.iceServers.length} servers)`);
          return {
            iceTransportPolicy: config.iceTransportPolicy === 'relay' ? 'relay' : 'all',
            iceServers: config.iceServers,
          };
        } catch (err) {
          log(`Using fallback ICE config: ${err.message}`);
          return fallbackRtcConfig;
        }
      })();

      return rtcConfigPromise;
    }

    function getActiveTransport() {
      return dc && dc.readyState === 'open' ? 'webrtc-datachannel' : 'not-ready';
    }

    function updateTransportBadge() {
      const active = getActiveTransport();
      setTransportStatus(active, active !== 'webrtc-datachannel');
    }

    function onDataChannelOpen() {
      log('DataChannel open. Using peer-to-peer text transport.');
      setPeerStatus('connected');
      myTextEl.disabled = false;
      updateTransportBadge();
      sendTextSync();
    }

    function attachDataChannel(channel) {
      dc = channel;
      dc.onopen = onDataChannelOpen;
      dc.onclose = () => {
        log('DataChannel closed. WebRTC text sync unavailable.');
        myTextEl.disabled = true;
        updateTransportBadge();
      };
      dc.onerror = (event) => {
        log(`DataChannel error: ${event.type}`);
      };
      dc.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'text-sync') {
            remoteTextEl.value = String(message.text || '');
          }
        } catch {
          // Ignore malformed data-channel payloads.
        }
      };
    }

    async function ensurePeerConnection() {
      if (pc) return;

      const rtcConfig = await getRtcConfig();
      pc = new RTCPeerConnection(rtcConfig);

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          sendWs({ type: 'signal', data: { candidate: event.candidate } });
        }
      };

      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        log(`ICE: ${state}`);
        if (state === 'connected' || state === 'completed') {
          setPeerStatus('connected');
        }
        if (state === 'disconnected' || state === 'failed' || state === 'closed') {
          setPeerStatus(state, true);
          updateTransportBadge();
        }
      };

      pc.onconnectionstatechange = () => {
        const state = pc.connectionState;
        log(`PC: ${state}`);
        if (state === 'failed') {
          updateTransportBadge();
        }
      };

      pc.ondatachannel = (event) => {
        log('DataChannel received from peer.');
        attachDataChannel(event.channel);
      };

      // Proactively create a channel; if both sides create one, both still work.
      if (!dc) {
        attachDataChannel(pc.createDataChannel('text-sync'));
      }
    }

    async function makeOffer() {
      if (!joined) return;
      await ensurePeerConnection();
      try {
        isMakingOffer = true;
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendWs({ type: 'signal', data: { description: pc.localDescription } });
        log('Offer sent.');
      } finally {
        isMakingOffer = false;
      }
    }

    async function handleDescription(description) {
      await ensurePeerConnection();

      const offerCollision = description.type === 'offer' && (isMakingOffer || pc.signalingState !== 'stable');
      ignoreOffer = !isPolite && offerCollision;
      if (ignoreOffer) {
        return;
      }

      await pc.setRemoteDescription(description);

      for (const candidate of iceCandidateBuffer) {
        try {
          await pc.addIceCandidate(candidate);
        } catch (err) {
          log(`Buffered ICE error: ${err.message}`);
        }
      }
      iceCandidateBuffer = [];

      if (description.type === 'offer') {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendWs({ type: 'signal', data: { description: pc.localDescription } });
        log('Answer sent.');
      }
    }

    async function handleCandidate(candidate) {
      if (!pc || !pc.remoteDescription) {
        iceCandidateBuffer.push(candidate);
        return;
      }

      try {
        await pc.addIceCandidate(candidate);
      } catch (err) {
        log(`ICE add error: ${err.message}`);
      }
    }

    function sendTextSync() {
      if (!joined) return;
      if (!dc || dc.readyState !== 'open') {
        return;
      }

      const payload = {
        type: 'text-sync',
        text: myTextEl.value,
      };

      dc.send(JSON.stringify(payload));

      updateTransportBadge();
    }

    function scheduleSend() {
      clearTimeout(sendTimer);
      sendTimer = setTimeout(sendTextSync, 40);
    }

    ws.onopen = () => {
      setSignalStatus('connected');
      log('Connected to signaling server.');
    };

    ws.onclose = () => {
      setSignalStatus('disconnected', true);
      myTextEl.disabled = true;
      log('Disconnected from signaling server.');
    };

    ws.onmessage = async (event) => {
      const message = JSON.parse(event.data);

      if (message.type === 'joined') {
        joined = true;
        roomId = message.roomId;
        myTextEl.disabled = true;
        setPeerStatus(message.peerCount > 1 ? 'peer-present' : 'waiting', message.peerCount <= 1);
        log(`Joined room: ${roomId} (peers: ${message.peerCount})`);

        if (message.peerCount === 2) {
          await makeOffer();
        }
        return;
      }

      if (message.type === 'peer-joined') {
        setPeerStatus('peer-present');
        log('Peer joined room.');
        await makeOffer();
        return;
      }

      if (message.type === 'peer-left') {
        setPeerStatus('waiting', true);
        setTransportStatus('not-ready', true);
        myTextEl.disabled = true;
        remoteTextEl.value = '';
        log('Peer left room.');
        return;
      }

      if (message.type === 'signal') {
        const { description, candidate } = message.data || {};
        if (description) {
          await handleDescription(description);
        }
        if (candidate) {
          await handleCandidate(candidate);
        }
        return;
      }

      if (message.type === 'error') {
        log(`Server error: ${message.message}`);
      }
    };

    joinBtn.addEventListener('click', () => {
      const nextRoom = roomIdEl.value.trim();
      if (!nextRoom) {
        log('Room ID cannot be empty.');
        return;
      }

      sendWs({ type: 'join', roomId: nextRoom });
      setPeerStatus('joining...', true);
    });

    myTextEl.addEventListener('input', scheduleSend);
    updateTransportBadge();
  </script>
</body>
</html>
