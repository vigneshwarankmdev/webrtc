<!doctype html>
<!--
  index.html — WebRTC Demo Client

  How it works:
  1. On load, a WebSocket connection is opened to the signaling server.
  2. The user enters a Room ID and clicks "Join Room" — a 'join' message
     is sent over WebSocket so the server groups two peers together.
  3. The first peer clicks "Start Call":
       a. getUserMedia() captures the local camera/microphone.
       b. An RTCPeerConnection is created with a public STUN server.
       c. An SDP offer is created and forwarded to the other peer via
          the signaling server (type: 'signal').
  4. The second peer receives the offer, creates an answer, and sends it back.
  5. Both peers exchange ICE candidates through the signaling server.
  6. Once ICE negotiation succeeds, media streams flow directly between
     the two browsers — the signaling server is no longer involved.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple WebRTC Demo</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #202330;
      --muted: #5f6578;
      --brand: #1363df;
      --brand-2: #0f4eb0;
      --border: #d8e0ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top right, #e8f1ff, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(21, 44, 88, 0.1);
      padding: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }

    .muted { color: var(--muted); margin-top: 0; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    input, button {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    button {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      cursor: pointer;
    }

    button:hover { background: var(--brand-2); }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    video {
      width: 100%;
      background: #101421;
      border-radius: 12px;
      border: 1px solid #2a3550;
      aspect-ratio: 16 / 9;
    }

    pre {
      margin: 12px 0 0;
      max-height: 180px;
      overflow: auto;
      background: #0f1424;
      color: #9bd0ff;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Simple WebRTC Signaling Demo</h1>
    <p class="muted">Open this page in two tabs, join the same room, and click Start in one tab.</p>

    <div class="row">
      <input id="roomId" value="demo-room" placeholder="Room ID" />
      <button id="joinBtn">Join Room</button>
      <button id="startBtn">Start Call</button>
    </div>

    <div class="videos">
      <div>
        <p class="muted">Local</p>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div>
        <p class="muted">Remote</p>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <pre id="log"></pre>
  </main>

  <script>
    // --- DOM references ---
    const logEl = document.getElementById('log');
    const roomIdEl = document.getElementById('roomId');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const joinBtn = document.getElementById('joinBtn');
    const startBtn = document.getElementById('startBtn');

    // Open WebSocket to the signaling server (same host, wss on HTTPS)
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${location.host}`);

    let pc;           // RTCPeerConnection instance
    let localStream;  // MediaStream from getUserMedia
    let joined = false;      // True once the server confirms room entry
    let makingOffer = false; // Guards against simultaneous offer creation
    let iceCandidateBuffer = []; // Buffer ICE candidates until remote description is set

    /** Append a timestamped message to the on-screen log. */
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    /** Send a JSON message to the signaling server over WebSocket. */
    function send(payload) {
      ws.send(JSON.stringify(payload));
    }

    /**
     * Request camera + microphone access and attach the stream to
     * the local <video> element. Only runs once per page load.
     */
    async function ensureMedia() {
      if (!localStream) {
        // Check if mediaDevices is available (requires HTTPS or localhost)
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera/microphone access not available. Ensure you are using HTTPS or localhost.');
        }
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        localVideo.srcObject = localStream;
      }
    }

    /**
     * Create the RTCPeerConnection (if not already created) and wire up
     * its event handlers. Also calls ensureMedia() so local tracks are
     * added before any offer/answer is negotiated.
     */
    async function ensurePeerConnection() {
      if (pc) return;

      // Use STUN + free TURN server for NAT traversal
      // STUN: finds public IP. TURN: relays media if direct connection fails
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject',
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject',
          },
        ],
      });

      // Log all ICE candidates discovered
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          log(`ICE candidate: ${event.candidate.candidate.split(' ')[4]} (${event.candidate.type})`);
          send({ type: 'signal', data: { candidate: event.candidate } });
        } else {
          log('ICE gathering complete.');
        }
      };

      // Attach the remote media stream to the remote <video> element
      pc.ontrack = (event) => {
        log(`Remote track received: ${event.track.kind}`);
        remoteVideo.srcObject = event.streams[0];
      };

      // Log connection state changes (connecting, connected, disconnected, etc.)
      pc.onconnectionstatechange = () => {
        log(`Connection state: ${pc.connectionState}`);
      };

      pc.oniceconnectionstatechange = () => {
        log(`ICE connection state: ${pc.iceConnectionState}`);
      };

      await ensureMedia();
      // Add local audio/video tracks so they are included in the SDP offer
      for (const track of localStream.getTracks()) {
        pc.addTrack(track, localStream);
      }
    }

    /**
     * Initiates a call by creating an SDP offer and sending it to the
     * remote peer through the signaling server.
     * Only the peer that clicks "Start Call" sends the offer.
     */
    async function startCall() {
      if (!joined) {
        log('Join a room first.');
        return;
      }

      await ensurePeerConnection();
      makingOffer = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer); // Triggers ICE candidate gathering
      send({ type: 'signal', data: { description: pc.localDescription } });
      makingOffer = false;
      log('Offer sent.');
    }

    ws.onopen = () => log('Connected to signaling server.');

    // Handle all incoming messages from the signaling server
    ws.onmessage = async (event) => {
      const message = JSON.parse(event.data);

      // Server confirmed room entry
      if (message.type === 'joined') {
        joined = true;
        log(`Joined room: ${message.roomId} (peers: ${message.peerCount})`);
        return;
      }

      // The other browser tab has joined the same room
      if (message.type === 'peer-joined') {
        log('Peer joined room.');
        return;
      }

      // The other peer disconnected — clear the remote video
      if (message.type === 'peer-left') {
        log('Peer left room.');
        remoteVideo.srcObject = null;
        return;
      }

      // Signaling message: either an SDP description or an ICE candidate
      if (message.type === 'signal') {
        const { description, candidate } = message.data || {};
        await ensurePeerConnection();

        if (description) {
          // Offer collision: both peers tried to send an offer simultaneously.
          // The 'polite' peer (always true here) rolls back and accepts the
          // incoming offer; the 'impolite' peer would ignore it.
          const offerCollision = description.type === 'offer' && (makingOffer || pc.signalingState !== 'stable');
          const polite = true;
          if (offerCollision && !polite) {
            return;
          }

          await pc.setRemoteDescription(description);
          
          // Flush any buffered ICE candidates now that remote description is set
          for (const bufferedCandidate of iceCandidateBuffer) {
            try {
              await pc.addIceCandidate(bufferedCandidate);
            } catch (err) {
              log(`Buffered ICE error: ${err.message}`);
            }
          }
          iceCandidateBuffer = [];
          
          // If the incoming description is an offer, create and send an answer
          if (description.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: 'signal', data: { description: pc.localDescription } });
            log('Answer sent.');
          }
          return;
        }

        // Add the received ICE candidate to the peer connection
        // If remote description isn't set yet, buffer the candidate
        if (candidate) {
          if (!pc.remoteDescription) {
            iceCandidateBuffer.push(candidate);
            log(`ICE candidate buffered (waiting for remote description)`);
            return;
          }
          try {
            await pc.addIceCandidate(candidate);
          } catch (err) {
            log(`ICE error: ${err.message}`);
          }
        }
        return;
      }

      if (message.type === 'error') {
        log(`Server error: ${message.message}`);
      }
    };

    // Send a 'join' message to the server with the chosen room ID
    joinBtn.addEventListener('click', () => {
      const roomId = roomIdEl.value.trim();
      if (!roomId) {
        log('Room ID cannot be empty.');
        return;
      }
      send({ type: 'join', roomId });
    });

    // Kick off the call from this peer (creates and sends the SDP offer)
    startBtn.addEventListener('click', () => {
      startCall().catch((err) => log(`Start call failed: ${err.message}`));
    });
  </script>
</body>
</html>
